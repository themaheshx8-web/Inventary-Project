<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Inventory Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-container card">
    <div class="auth-header">
      <div class="logo">📦 InvManager</div>
      <h2>Welcome Back</h2>
      <p>Sign in to manage your inventory and boxes</p>
    </div>

    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="input-control" placeholder="name@company.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="input-control" placeholder="••••••••" required>
      </div>

      <button type="submit" id="login-btn" class="btn btn-primary btn-block">
        <span class="btn-text">Sign In</span>
        <span class="spinner hidden"></span>
      </button>
    </form>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
